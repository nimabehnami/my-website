<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Theft Auto VI — Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0714;--pink:#ff4f8b;--sun:#ff9a3c;--cream:#f7efe6}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font:400 16px/1.6 'Archivo','Vazirmatn',sans-serif;-webkit-font-smoothing:antialiased}
html[lang=fa] body{font-family:'Vazirmatn','Archivo',sans-serif}
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(80% 60% at 75% 15%,#ff4f8b66,transparent),radial-gradient(70% 60% at 5% 95%,#ff9a3c55,transparent),var(--ink)}
#yt{position:absolute;top:50%;left:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);pointer-events:none;border:0;opacity:0;transition:opacity 1.8s}
#bg.on #yt{opacity:1}
.veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(to top,rgba(11,7,20,.94) 0,rgba(11,7,20,.35) 55%,rgba(11,7,20,.6) 100%)}
nav{position:fixed;top:0;inset-inline:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,56px)}
.logo{font:800 24px 'Archivo';font-stretch:125%;background:linear-gradient(95deg,var(--pink),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.b{background:rgba(11,7,20,.35);border:1px solid #f7efe655;color:inherit;border-radius:99px;padding:6px 16px;font:inherit;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.b:hover,.b[aria-pressed=true]{background:var(--cream);color:var(--ink)}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;padding:120px clamp(20px,4vw,56px) 36px}
h1{direction:ltr;text-align:left;font:800 clamp(42px,9.6vw,152px)/.92 'Archivo';font-stretch:125%;letter-spacing:-.03em;background:linear-gradient(95deg,var(--pink),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.date{font-size:clamp(15px,1.6vw,20px);opacity:.88}
.cd{display:flex;gap:clamp(18px,4.5vw,72px);direction:ltr}
.u{display:flex;flex-direction:column;overflow:hidden}
.n{font:700 clamp(46px,10vw,152px)/1.05 'Archivo';font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.l{font-size:14px;opacity:.7}
html[lang=fa] .u{align-items:flex-start}
.bar{height:2px;background:#f7efe630;direction:ltr}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sun));transition:width 2s cubic-bezier(.2,.7,.2,1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 32px}
.stats b{display:block;font:600 clamp(20px,2.4vw,30px)/1.25 'Archivo';font-variant-numeric:tabular-nums}
.stats span{font-size:13px;opacity:.65}
.hero>*{animation:up 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero>:nth-child(2){animation-delay:.12s}.hero>:nth-child(3){animation-delay:.24s}.hero>:nth-child(4){animation-delay:.36s}.hero>:nth-child(5){animation-delay:.48s}.hero>:nth-child(6){animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
.sec{background:var(--ink);padding:clamp(72px,12vw,160px) clamp(20px,4vw,56px)}
.sec h2{font:800 clamp(28px,4.6vw,66px)/1.08 'Archivo';font-stretch:112%;max-width:20ch;margin-bottom:28px}
.sec p{max-width:60ch;opacity:.8;font-size:clamp(16px,1.5vw,19px)}
.tl{list-style:none;padding:0;margin-top:48px;max-width:900px}
.tl li{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:24px;padding:20px 0;border-top:1px solid #f7efe626}
.tl li:last-child{border-bottom:1px solid #f7efe626}
.tl time{opacity:.6;font-size:15px}
.tl .go time,.tl .go span{color:var(--pink);opacity:1;font-weight:600}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 20px;padding:0 clamp(20px,4vw,56px);margin-bottom:clamp(56px,9vw,120px)}
.v{margin:0}
.v .p{position:relative;aspect-ratio:16/9;background:#1a1226;overflow:hidden}
.v img,.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.v .th{position:absolute;inset:0;z-index:1;border:0;padding:0;background:none;cursor:pointer}
.v .th::before{content:'';position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:var(--cream)}
.v .th::after{content:'';position:absolute;left:50%;top:50%;margin:-10px 0 0 -6px;border:10px solid transparent;border-left:16px solid var(--ink);border-right:0}
.v .th:hover+img,.v:hover img{transform:scale(1.04)}
.v figcaption{margin-top:10px;font-size:15px;opacity:.85}
.tz{list-style:none;padding:0;margin-top:40px;max-width:900px}
.tz li{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px;padding:16px 0;border-top:1px solid #f7efe626;font-variant-numeric:tabular-nums}
.tz li:last-child{border-bottom:1px solid #f7efe626}
.tz li span:nth-child(2){opacity:.65}
.tz li span:last-child{direction:ltr;text-align:end}
@media (max-width:560px){.tz li{grid-template-columns:1fr 1fr}.tz li span:nth-child(2){grid-row:2;grid-column:1/-1;font-size:14px}}
.sec.g{padding-inline:0}
.g h2{padding-inline:clamp(20px,4vw,56px)}
.gal{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(20px,4vw,56px) 12px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 min(80vw,760px);aspect-ratio:16/9;scroll-snap-align:start;overflow:hidden;background:#1a1226;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.gal figure:hover img{transform:scale(1.04)}
#lb{border:0;background:rgba(11,7,20,.96);width:100vw;height:100vh;max-width:none;max-height:none;padding:4vw;cursor:zoom-out}
#lb[open]{display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb::backdrop{background:#000}
footer{background:var(--ink);padding:32px clamp(20px,4vw,56px) 48px;font-size:13px;opacity:.55;border-top:1px solid #f7efe61a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:560px){.tl li{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<div id="bg"><div id="yt"></div></div>
<div class="veil"></div>

<nav>
  <span class="logo">VI</span>
  <div class="row">
    <button class="b" id="snd" aria-pressed="false" data-i="snd"></button>
    <button class="b" id="lg">فارسی</button>
  </div>
</nav>

<header class="hero" id="hero">
  <h1>Grand Theft Auto VI</h1>
  <p class="date" id="dt"></p>
  <div class="cd" role="timer" aria-live="off">
    <div class="u"><span class="n" id="d">00</span><span class="l" data-i="d"></span></div>
    <div class="u"><span class="n" id="h">00</span><span class="l" data-i="h"></span></div>
    <div class="u"><span class="n" id="m">00</span><span class="l" data-i="m"></span></div>
    <div class="u"><span class="n" id="s">00</span><span class="l" data-i="s"></span></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="pg"></i></div>
  <div class="stats">
    <div><b id="sw"></b><span data-i="sw"></span></div>
    <div><b id="sh"></b><span data-i="sh"></span></div>
    <div><b id="sm"></b><span data-i="sm"></span></div>
    <div><b id="ss"></b><span data-i="ss"></span></div>
    <div><b id="sp"></b><span data-i="sp"></span></div>
  </div>
  <div class="row">
    <button class="b" data-v="0" aria-pressed="true" data-i="t1"></button>
    <button class="b" data-v="1" aria-pressed="false" data-i="t2"></button>
  </div>
</header>

<section class="sec">
  <h2 data-i="h2"></h2>
  <p data-i="p"></p>
  <ol class="tl" id="tl"></ol>
</section>

<section class="sec g" style="padding-bottom:0">
  <h2 data-i="th"></h2>
  <div class="tr" id="tr"></div>
</section>

<section class="sec g">
  <h2 data-i="gh"></h2>
  <div class="gal" id="gal"></div>
</section>

<section class="sec">
  <h2 data-i="zh"></h2>
  <p data-i="zp"></p>
  <ul class="tz" id="tz"></ul>
</section>

<footer data-i="ft"></footer>
<dialog id="lb"><img alt=""></dialog>

<script>
const TARGET = new Date(2026, 10, 19, 0, 0, 0);   // 19 Nov 2026, 00:00 local time
const START  = new Date(2023, 11, 5);             // first trailer
const VIDEOS = ['QdBZY2fkU-0', 'VQRLujxTm3c'];    // Trailer 1, Trailer 2 (YouTube IDs)

/* Gallery: put your own images next to this file, e.g. IMAGES = ['images/1.jpg','images/2.jpg'].
   If the list is empty, frames from the two trailers are used. */
const IMAGES = [];
const frames = IMAGES.length ? IMAGES : VIDEOS.flatMap(v => ['maxresdefault', 'maxres2', 'maxres3'].map(n => `https://img.youtube.com/vi/${v}/${n}.jpg`));
const $g = document.getElementById('gal');
frames.forEach((src, i) => {
  const f = document.createElement('figure'), im = new Image();
  im.alt = 'Grand Theft Auto VI ' + (i + 1); im.loading = 'lazy'; im.decoding = 'async'; im.src = src;
  im.onerror = () => f.remove();
  im.onload = () => { if (im.naturalWidth < 400) f.remove(); };
  f.appendChild(im); f.onclick = () => { const lb = document.getElementById('lb'); lb.firstChild.src = src; lb.showModal(); };
  $g.appendChild(f);
});
document.getElementById('lb').onclick = e => e.currentTarget.close();

/* Trailers: thumbnail first, iframe loads only on click (keeps the page light) */
const TR = [
  {id:'QdBZY2fkU-0', en:'Trailer 1', fa:'تریلر ۱'},
  {id:'VQRLujxTm3c', en:'Trailer 2', fa:'تریلر ۲'},
  {id:'qq76pQsI1iw', en:'Extended look', fa:'نگاهی گسترده‌تر'},
  {id:'rz1B4B2yBZY', en:'Launch trailer', fa:'تریلر انتشار'},
  {id:'_yl5ELcmugI', en:'Preload trailer', fa:'تریلر پیش‌دانلود'}
];
const trEl = document.getElementById('tr');
TR.forEach(v => {
  const f = document.createElement('figure'); f.className = 'v';
  f.innerHTML = `<div class="p"><button class="th" aria-label="Play"></button><img loading="lazy" decoding="async" alt="" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"></div><figcaption></figcaption>`;
  f.querySelector('.th').onclick = () => {
    const i = document.createElement('iframe');
    i.src = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`;
    i.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; i.allowFullscreen = true; i.title = v.en;
    f.querySelector('.p').replaceChildren(i);
  };
  trEl.appendChild(f);
});

/* Launch by city: the instant when it is 00:00 on 19 Nov in each time zone */
const CITIES = [['Tehran','تهران','Asia/Tehran'],['Dubai','دبی','Asia/Dubai'],['London','لندن','Europe/London'],['New York','نیویورک','America/New_York'],['Los Angeles','لس‌آنجلس','America/Los_Angeles'],['Tokyo','توکیو','Asia/Tokyo'],['Sydney','سیدنی','Australia/Sydney']];
function midnightIn(tz){
  const off = t => {
    const p = new Intl.DateTimeFormat('en-US', {timeZone:tz, hourCycle:'h23', year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', second:'numeric'}).formatToParts(new Date(t));
    const g = k => +p.find(x => x.type === k).value;
    return Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - t;
  };
  const base = Date.UTC(2026, 10, 19);
  return base - off(base - off(base));
}
const ZONES = CITIES.map(c => ({n:[c[0], c[1]], t:midnightIn(c[2])}));

const T = {
 en:{snd:'Sound on',snd2:'Sound off',d:'Days',h:'Hours',m:'Minutes',s:'Seconds',
  sw:'Weeks and days left',sh:'Total hours',sm:'Total minutes',ss:'Total seconds',sp:'Of the wait since Trailer 1',
  t1:'Trailer 1',t2:'Trailer 2',gh:'Gallery',th:'Trailers',zh:'Launch by city',zp:'Each city counts down to midnight on 19 November. Rockstar has not confirmed an exact launch time, so treat this as an estimate.',play:'Play',mid:'Midnight, your local time',out:'Out now',
  h2:'Back to Vice City.',
  p:'Jason and Lucia are on the run in Leonida, the state around Vice City. Grand Theft Auto VI launches on PlayStation 5 and Xbox Series X|S. A PC release has not been announced.',
  ft:'Unofficial fan page. Not affiliated with Rockstar Games or Take-Two Interactive. Trailers are embedded from YouTube.',
  tl:[['Feb 2022','Rockstar confirms Grand Theft Auto VI is in development.'],['5 Dec 2023','Trailer 1 shows Vice City and announces a 2025 release.'],['2 May 2025','Release delayed to 26 May 2026.'],['6 May 2025','Trailer 2 arrives.'],['6 Nov 2025','Release delayed to 19 November 2026.'],['19 Nov 2026','Launch day.']]},
 fa:{snd:'پخش صدا',snd2:'قطع صدا',d:'روز',h:'ساعت',m:'دقیقه',s:'ثانیه',
  sw:'هفته و روز مانده',sh:'کل ساعت‌ها',sm:'کل دقیقه‌ها',ss:'کل ثانیه‌ها',sp:'از انتظار پس از تریلر ۱',
  t1:'تریلر ۱',t2:'تریلر ۲',gh:'گالری',th:'تریلرها',zh:'زمان انتشار در شهرها',zp:'هر شهر تا نیمه‌شب ۱۹ نوامبر شمارش می‌کند. راکستار ساعت دقیق انتشار را تأیید نکرده، پس این زمان‌ها تخمینی‌اند.',play:'پخش',mid:'نیمه‌شب، به وقت محلی شما',out:'منتشر شد',
  h2:'بازگشت به وایس سیتی.',
  p:'جیسون و لوسیا در لئونیدا، ایالتی که وایس سیتی در آن قرار دارد، در حال فرارند. Grand Theft Auto VI برای پلی‌استیشن ۵ و ایکس‌باکس سری X|S منتشر می‌شود. نسخهٔ PC هنوز اعلام نشده است.',
  ft:'صفحهٔ غیررسمی هواداری. وابسته به راکستار گیمز یا تیک‌تو اینتراکتیو نیست. تریلرها از یوتیوب نمایش داده می‌شوند.',
  tl:[['فوریه ۲۰۲۲','راکستار توسعهٔ بازی را تأیید می‌کند.'],['۵ دسامبر ۲۰۲۳','تریلر ۱ وایس سیتی را نشان می‌دهد و انتشار در ۲۰۲۵ اعلام می‌شود.'],['۲ مه ۲۰۲۵','انتشار به ۲۶ مه ۲۰۲۶ موکول می‌شود.'],['۶ مه ۲۰۲۵','تریلر ۲ منتشر می‌شود.'],['۶ نوامبر ۲۰۲۵','انتشار به ۱۹ نوامبر ۲۰۲۶ موکول می‌شود.'],['۱۹ نوامبر ۲۰۲۶','روز انتشار.']]}
};

let lang = 'en', P = null, muted = true, prev = {};
const $ = id => document.getElementById(id);
const digits = s => lang === 'fa' ? s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : s;
const pad = n => digits(String(n).padStart(2, '0'));
const fmt = n => n.toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-US');

function setLang(l){
  lang = l;
  const t = T[l], el = document.documentElement;
  el.lang = l; el.dir = l === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(e => { if (e.id !== 'snd') e.textContent = t[e.dataset.i]; });
  $('snd').textContent = muted ? t.snd : t.snd2;
  $('lg').textContent = l === 'fa' ? 'English' : 'فارسی';
  $('tl').innerHTML = t.tl.map((r, i) => `<li${i === 5 ? ' class="go"' : ''}><time>${r[0]}</time><span>${r[1]}</span></li>`).join('');
  const f = (loc, o) => new Intl.DateTimeFormat(loc, o).format(TARGET);
  $('dt').textContent = l === 'fa'
    ? f('fa-IR-u-ca-persian', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) + ' (' + f('fa-IR-u-ca-gregory', {day:'numeric', month:'long', year:'numeric'}) + ') · ' + t.mid
    : f('en-GB', {dateStyle:'full'}) + ' · ' + t.mid;
  const loc = l === 'fa' ? 'fa-IR' : 'en-GB', k = l === 'fa' ? 1 : 0;
  document.querySelectorAll('.v figcaption').forEach((c, i) => c.textContent = TR[i][l]);
  document.querySelectorAll('.th').forEach(b => b.setAttribute('aria-label', t.play));
  $('tz').innerHTML = ZONES.map((z, i) => `<li><span>${z.n[k]}</span><span>${new Intl.DateTimeFormat(loc, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}).format(z.t)}</span><span id="z${i}"></span></li>`).join('');
  prev = {}; tick(true);
  try { localStorage.setItem('gta6lang', l); } catch (e) {}
}

function put(id, v){
  const e = $(id);
  if (prev[id] === v) return;
  e.textContent = v;
  if (prev[id] !== undefined && e.animate) e.animate([{transform:'translateY(40%)',opacity:0},{transform:'none',opacity:1}], {duration:420, easing:'cubic-bezier(.2,.7,.2,1)'});
  prev[id] = v;
}

let timer;
function tick(once){
  const now = Date.now(), diff = Math.max(0, TARGET - now), sec = Math.floor(diff / 1000);
  put('d', pad(Math.floor(sec / 86400)));
  put('h', pad(Math.floor(sec % 86400 / 3600)));
  put('m', pad(Math.floor(sec % 3600 / 60)));
  put('s', pad(sec % 60));
  const days = Math.floor(sec / 86400);
  $('sw').textContent = digits(Math.floor(days / 7) + ' w · ' + days % 7 + ' d').replace('w', lang === 'fa' ? 'هفته' : 'w').replace('d', lang === 'fa' ? 'روز' : 'd');
  $('sh').textContent = fmt(Math.floor(sec / 3600));
  $('sm').textContent = fmt(Math.floor(sec / 60));
  $('ss').textContent = fmt(sec);
  const pct = Math.min(100, (now - START) / (TARGET - START) * 100);
  $('sp').textContent = digits(pct.toFixed(2)) + '%';
  $('pg').style.width = pct + '%';
  ZONES.forEach((z, i) => {
    const r = Math.max(0, Math.floor((z.t - now) / 1000)), e = $('z' + i);
    if (e) e.textContent = digits(Math.floor(r / 86400)) + (lang === 'fa' ? ' روز ' : 'd ') + pad(Math.floor(r % 86400 / 3600)) + ':' + pad(Math.floor(r % 3600 / 60)) + ':' + pad(r % 60);
  });
  if (!diff) $('dt').textContent = T[lang].out;
  if (once !== true) { clearTimeout(timer); if (diff) timer = setTimeout(tick, 1000 - Date.now() % 1000); }
}

/* Background video (single YouTube player, muted, loops, pauses when not visible) */
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);
window.onYouTubeIframeAPIReady = () => {
  P = new YT.Player('yt', {
    videoId: VIDEOS[0],
    playerVars: {autoplay:1, controls:0, mute:1, playsinline:1, rel:0, modestbranding:1, disablekb:1, fs:0, iv_load_policy:3},
    events: {
      onReady: e => { e.target.mute(); e.target.playVideo(); },
      onStateChange: e => { if (e.data === 1) $('bg').classList.add('on'); if (e.data === 0) P.seekTo(0); },
      onError: () => $('bg').classList.remove('on')
    }
  });
};
new IntersectionObserver(([e]) => { if (P && P.playVideo) e.isIntersecting ? P.playVideo() : P.pauseVideo(); }, {threshold:.05}).observe($('hero'));

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (P && P.loadVideoById) { $('bg').classList.remove('on'); P.loadVideoById(VIDEOS[+b.dataset.v]); }
});
$('snd').onclick = () => {
  if (!P || !P.unMute) return;
  muted = !muted;
  muted ? P.mute() : (P.unMute(), P.setVolume(60));
  $('snd').setAttribute('aria-pressed', !muted);
  $('snd').textContent = muted ? T[lang].snd : T[lang].snd2;
};
$('lg').onclick = () => setLang(lang === 'fa' ? 'en' : 'fa');

let saved = 'en';
try { saved = localStorage.getItem('gta6lang') || (navigator.language.startsWith('fa') ? 'fa' : 'en'); } catch (e) {}
setLang(saved);
tick();
</script>
</body>
</html>
